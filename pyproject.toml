
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-toolbox"
version = "0.1.0"
description = "A lightweight educational toolkit for CTF challenges"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "galialif" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ctf_toolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
